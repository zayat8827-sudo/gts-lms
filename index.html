<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G.T.S. LMS — Galaxy Testing Society</title>
<style>
:root{--navy:#071a4d;--blue:#1457d9;--sky:#35b9ff;--bg:#f4f8ff;--card:#fff;--text:#102044;--muted:#64748b;--ok:#16a34a;--danger:#dc2626;--border:#dbe5f5}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.hidden{display:none!important}
.top{height:66px;background:linear-gradient(100deg,var(--navy),var(--blue));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}
.brand{font-weight:900;letter-spacing:.6px}.brand small{display:block;font-size:10px;opacity:.75;letter-spacing:2px}
.wrap{max-width:1150px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 8px 25px #183d7b0b}
.hero{background:linear-gradient(135deg,#071a4d,#1266e8 65%,#35b9ff);color:#fff;border-radius:24px;padding:30px;margin-bottom:20px}
h1,h2,h3{margin-top:0}.muted{color:var(--muted)}.btn{border:0;border-radius:11px;padding:11px 16px;cursor:pointer;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:#eaf3ff;color:var(--navy)}.danger{background:#fee2e2;color:#991b1b}.full{width:100%}
.stat{font-size:30px;font-weight:900}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#eaf3ff;color:var(--blue);font-size:12px;font-weight:800}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.toolbar{display:flex;gap:10px;flex-wrap:wrap}
input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:#fff;outline:none}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}
.login{max-width:430px;margin:8vh auto}.notice{padding:12px;border-radius:10px;background:#fff7ed;color:#9a3412;margin:12px 0}
.test-head{position:sticky;top:66px;background:#fff;border-bottom:1px solid var(--border);padding:12px 0;z-index:4}.timer{font-weight:900;color:var(--danger);font-size:18px}
.q{margin-bottom:18px}.option{display:block;padding:12px;border:1px solid var(--border);border-radius:11px;margin:8px 0;cursor:pointer}.option:hover{background:#f4f8ff}.option input{width:auto;margin-right:8px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid var(--border);text-align:left}.table th{background:#f8fbff}
@media(max-width:600px){.wrap{padding:14px}.hero{padding:22px}.top{padding:0 14px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">GALAXY TESTING SOCIETY <small>G.T.S. • LMS</small></div>
  <div id="topActions"></div>
</header>
<main class="wrap" id="app"></main>

<script>
const DEMO_TESTS=[
 {id:1,title:"Complete PMDC Full Syllabus Mega Test",category:"Full Syllabus",duration:180,total:10,questions:[
  ["Which organelle is known as the powerhouse of the cell?",["Nucleus","Mitochondrion","Ribosome","Golgi apparatus"],1],
  ["The SI unit of electric current is:",["Volt","Ohm","Ampere","Watt"],2],
  ["The pH of a neutral solution at 25°C is:",["5","7","9","14"],1],
  ["Which blood cells are primarily responsible for immunity?",["RBCs","Platelets","WBCs","Plasma cells"],2],
  ["Acceleration due to gravity near Earth's surface is approximately:",["4.9 m/s²","9.8 m/s²","19.6 m/s²","98 m/s²"],1],
  ["The functional unit of the kidney is:",["Neuron","Nephron","Alveolus","Sarcomere"],1],
  ["Avogadro's number is approximately:",["6.02×10²³","9.8×10²","3.0×10⁸","1.6×10⁻¹⁹"],0],
  ["Which bond involves sharing of electrons?",["Ionic","Covalent","Metallic","Hydrogen"],1],
  ["The genetic material in most organisms is:",["Protein","RNA only","DNA","Lipid"],2],
  ["A lens that converges parallel light rays is:",["Concave","Convex","Plane","Cylindrical"],1]
 ]},
 {id:2,title:"Biology — Acellular Life",category:"Biology",duration:60,total:5,questions:[
  ["Viruses are generally considered:",["Acellular","Multicellular","Prokaryotic cells","Eukaryotic cells"],0],
  ["The protein coat of a virus is called:",["Capsid","Cell wall","Envelope only","Nucleoid"],0],
  ["Viruses require a host cell mainly for:",["Movement","Replication","Photosynthesis","Digestion"],1],
  ["Bacteriophages infect:",["Plants","Animals","Bacteria","Fungi"],2],
  ["Viral genetic material may be:",["Only DNA","Only RNA","DNA or RNA","Protein only"],2]
 ]},
 {id:3,title:"Chemistry — Fundamental Concepts",category:"Chemistry",duration:60,total:5,questions:[
  ["One mole contains approximately:",["6.02×10²³ particles","9.8 particles","3.0×10⁸ particles","1.6×10⁻¹⁹ particles"],0],
  ["The empirical formula represents:",["Actual molecular mass","Simplest whole-number ratio","Electron configuration","Bond angle"],1],
  ["Molar mass of H₂O is approximately:",["10 g/mol","18 g/mol","20 g/mol","36 g/mol"],1],
  ["A limiting reagent is the reactant that:",["Remains in excess","Is consumed first","Is a catalyst","Never reacts"],1],
  ["% yield equals actual yield divided by theoretical yield multiplied by:",["10","50","100","1000"],2]
 ]}
];

let state={user:null,page:"login",activeTest:null,answers:{},timeLeft:0,timer:null,results:JSON.parse(localStorage.getItem("gts_results")||"[]")};
const app=document.getElementById("app"), topActions=document.getElementById("topActions");
function save(){localStorage.setItem("gts_results",JSON.stringify(state.results))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function nav(){topActions.innerHTML=state.user?`<button class="btn secondary" onclick="logout()">Logout</button>`:""}
function render(){nav(); if(state.page==="login")login(); else if(state.page==="dashboard")dashboard(); else if(state.page==="test")testPage(); else if(state.page==="result")resultPage(); else if(state.page==="admin")adminPage()}
function login(){
 app.innerHTML=`<section class="card login"><div style="text-align:center"><div style="font-size:42px">🩺</div><h1>G.T.S. LMS</h1><p class="muted">Galaxy Testing Society • MDCAT Testing Portal</p></div>
 <div class="notice"><b>Demo access:</b> use any name and Candidate ID. Admin demo: <b>admin</b> / <b>admin123</b></div>
 <div class="field"><label>Candidate Name</label><input id="name" placeholder="Enter your name"></div>
 <div class="field"><label>Candidate ID</label><input id="cid" placeholder="e.g. GTS-1001"></div>
 <button class="btn primary full" onclick="studentLogin()">Student Login</button>
 <button class="btn secondary full" style="margin-top:8px" onclick="adminLogin()">Admin Demo Login</button></section>`;
}
function studentLogin(){let n=document.getElementById("name").value.trim(),c=document.getElementById("cid").value.trim();if(!n||!c)return alert("Please enter name and Candidate ID.");state.user={name:n,id:c,role:"student"};state.page="dashboard";render()}
function adminLogin(){let u=prompt("Admin username:");let p=prompt("Admin password:");if(u==="admin"&&p==="admin123"){state.user={name:"Administrator",id:"ADMIN",role:"admin"};state.page="admin";render()}else alert("Demo admin login: admin / admin123")}
function logout(){clearInterval(state.timer);state={...state,user:null,page:"login",activeTest:null,answers:{},timeLeft:0,timer:null,results:JSON.parse(localStorage.getItem("gts_results")||"[]")};render()}
function dashboard(){
 let my=state.results.filter(r=>r.cid===state.user.id), best=my.length?Math.max(...my.map(r=>r.score)):0;
 app.innerHTML=`<section class="hero"><div class="pill" style="background:#ffffff22;color:#fff">STUDENT PORTAL</div><h1>Welcome, ${esc(state.user.name)} 👋</h1><p>Prepare smarter with G.T.S. online MDCAT tests.</p></section>
 <div class="grid" style="margin-bottom:18px"><div class="card"><div class="muted">Available Tests</div><div class="stat">${DEMO_TESTS.length}</div></div><div class="card"><div class="muted">Attempts</div><div class="stat">${my.length}</div></div><div class="card"><div class="muted">Best Score</div><div class="stat">${best}%</div></div></div>
 <div class="row"><h2>Available Tests</h2><span class="pill">MDCAT 2026</span></div><div class="grid">${DEMO_TESTS.map(t=>`<div class="card"><span class="pill">${esc(t.category)}</span><h3 style="margin-top:12px">${esc(t.title)}</h3><p class="muted">${t.total} MCQs • ${t.duration} minutes</p><button class="btn primary full" onclick="startTest(${t.id})">Start Test</button></div>`).join("")}</div>
 <div class="card" style="margin-top:18px"><div class="row"><h2>My Test History</h2><button class="btn secondary" onclick="dashboard()">Refresh</button></div>${my.length?`<table class="table"><tr><th>Test</th><th>Score</th><th>Date</th></tr>${my.slice().reverse().map(r=>`<tr><td>${esc(r.title)}</td><td>${r.score}/${r.total} (${Math.round(r.score/r.total*100)}%)</td><td>${esc(r.date)}</td></tr>`).join("")}</table>`:`<p class="muted">No attempts yet.</p>`}</div>`;
}
function startTest(id){let t=DEMO_TESTS.find(x=>x.id===id);state.activeTest=t;state.answers={};state.timeLeft=t.duration*60;state.page="test";render();state.timer=setInterval(()=>{state.timeLeft--;updateTimer();if(state.timeLeft<=0){clearInterval(state.timer);submitTest(true)}},1000)}
function updateTimer(){let el=document.getElementById("timer");if(!el)return;let m=Math.floor(state.timeLeft/60),s=state.timeLeft%60;el.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function testPage(){
 let t=state.activeTest;
 app.innerHTML=`<div class="test-head"><div class="row"><div><b>${esc(t.title)}</b><div class="muted">${t.total} MCQs</div></div><div class="timer" id="timer"></div></div></div>
 <div style="margin-top:18px">${t.questions.map((q,i)=>`<div class="card q"><h3>Q${i+1}. ${esc(q[0])}</h3>${q[1].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${state.answers[i]===j?"checked":""} onchange="state.answers[${i}]=${j}"> ${esc(o)}</label>`).join("")}</div>`).join("")}</div>
 <button class="btn primary full" onclick="submitTest(false)">Submit Test</button>`;
 updateTimer();
}
function submitTest(auto){
 if(!auto&&!confirm("Submit your test now?"))return;
 clearInterval(state.timer);let t=state.activeTest,score=t.questions.reduce((a,q,i)=>a+(state.answers[i]===q[2]?1:0),0);
 state.results.push({cid:state.user.id,name:state.user.name,title:t.title,score,total:t.total,date:new Date().toLocaleString()});save();state.lastScore=score;state.page="result";render();
}
function resultPage(){
 let t=state.activeTest,s=state.lastScore,p=Math.round(s/t.total*100);
 app.innerHTML=`<section class="card" style="max-width:650px;margin:40px auto;text-align:center"><div style="font-size:55px">${p>=80?"🏆":p>=50?"🎯":"📚"}</div><h1>Test Submitted</h1><p class="muted">${esc(t.title)}</p><div class="stat">${s} / ${t.total}</div><h2>${p}%</h2><p>${p>=80?"Excellent performance!":p>=50?"Good attempt—keep practicing!":"Keep practicing and try again!"}</p><div class="toolbar" style="justify-content:center"><button class="btn primary" onclick="state.page='dashboard';render()">Back to Dashboard</button><button class="btn secondary" onclick="state.page='test';state.answers={};startTest(${t.id})">Retake</button></div></section>`;
}
function adminPage(){
 let total=state.results.length;
 app.innerHTML=`<section class="hero"><span class="pill" style="background:#ffffff22;color:#fff">ADMIN PANEL</span><h1>G.T.S. LMS Control Center</h1><p>Demo dashboard for managing tests and viewing submissions.</p></section>
 <div class="grid"><div class="card"><div class="muted">Tests</div><div class="stat">${DEMO_TESTS.length}</div></div><div class="card"><div class="muted">Submissions</div><div class="stat">${total}</div></div><div class="card"><div class="muted">Students</div><div class="stat">${new Set(state.results.map(r=>r.cid)).size}</div></div></div>
 <div class="card" style="margin-top:18px"><div class="row"><h2>Tests</h2><button class="btn primary" onclick="alert('Prototype: connect this button to your question bank/database to add unlimited tests.')">+ Add Test</button></div><table class="table"><tr><th>Test</th><th>Category</th><th>MCQs</th><th>Duration</th></tr>${DEMO_TESTS.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(t.category)}</td><td>${t.total}</td><td>${t.duration} min</td></tr>`).join("")}</table></div>
 <div class="card" style="margin-top:18px"><h2>Recent Submissions</h2>${state.results.length?`<table class="table"><tr><th>Candidate</th><th>Test</th><th>Score</th><th>Date</th></tr>${state.results.slice().reverse().map(r=>`<tr><td>${esc(r.name)}<br><span class="muted">${esc(r.cid)}</span></td><td>${esc(r.title)}</td><td>${r.score}/${r.total}</td><td>${esc(r.date)}</td></tr>`).join("")}</table>`:`<p class="muted">No submissions yet. Ask a student to take the demo test.</p>`}</div>`;
}
render();
</script>
</body>
</html>
